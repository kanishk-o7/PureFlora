{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} — Pure Flora</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><div class="announcement">PURE FLORA GROWER STUDIO</div><header class="site-header"><a class="brand" href="{% url 'home' %}"><span class="brand-mark">✿</span><span>pure flora<small>FLOWERS, GROWN WITH CARE</small></span></a><a href="{% url 'florist_dashboard' %}" class="text-link">Back to dashboard</a></header><main class="inner-page"><section class="page-hero compact-hero"><div class="eyebrow">YOUR CATALOGUE</div><h1>{{ title }}</h1></section><section class="section"><div class="dashboard-card"><form method="post" enctype="multipart/form-data" class="stack-form">{% csrf_token %}{% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small>{{ error }}</small>{% endfor %}</div>{% endfor %}<button class="button button-dark">Save listing ↗</button></form></div></section></main><script src="/static/js/back-navigation.js" defer></script></body></html>
