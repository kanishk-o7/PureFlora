<!-- Mobile Filter Drawer Component -->
<div 
  id="mobile-filter-drawer" 
  class="fixed inset-0 z-50 pointer-events-none" 
  aria-modal="true" 
  role="dialog"
>
  <!-- Backdrop -->
  <div 
    id="mobile-filter-backdrop" 
    class="drawer-backdrop fixed inset-0 bg-zinc-900/50 backdrop-blur-xs opacity-0 transition-opacity"
  ></div>

  <!-- Drawer Panel -->
  <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
    <div class="drawer-panel w-screen max-w-xs sm:max-w-sm bg-white shadow-2xl flex flex-col transform translate-x-full transition-transform ease-in-out duration-300">
      
      <!-- Drawer Header -->
      <div class="px-5 py-4 border-b border-zinc-200 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          <h3 class="font-bold text-zinc-900 text-base">Filter Products</h3>
        </div>
        <button 
          type="button" 
          id="close-mobile-filters-btn"
          class="p-2 -mr-2 text-zinc-400 hover:text-zinc-600 rounded-lg"
          aria-label="Close filters"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Drawer Content (Scrollable Sections) -->
      <div class="flex-1 overflow-y-auto p-5 divide-y divide-zinc-100 text-sm">
        
        <!-- Price Range -->
        <div class="py-3">
          <h4 class="font-semibold text-xs uppercase tracking-wider text-zinc-500 mb-2.5">Price Range</h4>
          <div class="space-y-2">
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-price" value="under_500" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">Under ₹500</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-price" value="500_1000" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">₹500 – ₹1,000</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-price" value="1000_2500" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">₹1,000 – ₹2,500</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-price" value="above_2500" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">₹2,500+</span>
            </label>
          </div>
        </div>

        <!-- Quantity -->
        <div class="py-3">
          <h4 class="font-semibold text-xs uppercase tracking-wider text-zinc-500 mb-2.5">Quantity / Stems</h4>
          <div class="space-y-2">
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-quantity" value="1_10" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">1 – 10 stems</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-quantity" value="10_50" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">10 – 50 stems</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-quantity" value="50_100" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">50 – 100 stems</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-quantity" value="100_plus" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">100+ bulk</span>
            </label>
          </div>
        </div>

        <!-- Colors -->
        <div class="py-3">
          <h4 class="font-semibold text-xs uppercase tracking-wider text-zinc-500 mb-2.5">Color</h4>
          <div class="space-y-2">
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-color" value="Red" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="w-3 h-3 rounded-full bg-red-500 border border-zinc-300"></span>
              <span class="text-xs">Red</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-color" value="White" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="w-3 h-3 rounded-full bg-white border border-zinc-300"></span>
              <span class="text-xs">White</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-color" value="Pink" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="w-3 h-3 rounded-full bg-pink-400 border border-zinc-300"></span>
              <span class="text-xs">Pink</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-color" value="Yellow" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="w-3 h-3 rounded-full bg-amber-400 border border-zinc-300"></span>
              <span class="text-xs">Yellow</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-color" value="Mixed" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="w-3 h-3 rounded-full bg-gradient-to-tr from-pink-400 via-amber-300 to-indigo-400 border border-zinc-300"></span>
              <span class="text-xs">Mixed</span>
            </label>
          </div>
        </div>

        <!-- Flower Type -->
        <div class="py-3">
          <h4 class="font-semibold text-xs uppercase tracking-wider text-zinc-500 mb-2.5">Flower Type</h4>
          <div class="space-y-2">
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-type" value="Roses" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">Roses</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-type" value="Lilies" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">Lilies</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-type" value="Orchids" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">Orchids</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-type" value="Carnations" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">Carnations</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-type" value="Marigold" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">Marigold</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-type" value="Mixed" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs">Mixed Blooms</span>
            </label>
          </div>
        </div>

        <!-- Availability -->
        <div class="pt-3">
          <h4 class="font-semibold text-xs uppercase tracking-wider text-zinc-500 mb-2.5">Availability</h4>
          <div class="space-y-2">
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-availability" value="in_stock" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs font-medium text-emerald-700">In Stock</span>
            </label>
            <label class="flex items-center gap-2.5 text-zinc-700">
              <input type="checkbox" name="filter-availability" value="pre_order" class="w-4 h-4 rounded text-emerald-600 border-zinc-300">
              <span class="text-xs font-medium text-amber-700">Pre-order</span>
            </label>
          </div>
        </div>

      </div>

      <!-- Drawer Footer Actions: Apply & Clear -->
      <div class="p-4 border-t border-zinc-200 bg-zinc-50 flex items-center gap-3">
        <button 
          type="button" 
          id="clear-mobile-filters-btn"
          class="flex-1 py-2.5 px-4 text-xs font-semibold rounded-xl border border-zinc-300 text-zinc-700 bg-white hover:bg-zinc-100 transition"
        >
          Clear All
        </button>
        <button 
          type="button" 
          id="apply-mobile-filters-btn"
          class="flex-1 py-2.5 px-4 text-xs font-semibold rounded-xl bg-emerald-700 text-white hover:bg-emerald-800 transition shadow-sm"
        >
          Apply Filters
        </button>
      </div>

    </div>
  </div>
</div>
