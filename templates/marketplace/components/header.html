<!-- Header Component -->
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-zinc-200/80 transition-shadow duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Top Row: Logo, Search (Desktop), Mode Toggle, Cart, Login -->
    <div class="flex items-center justify-between h-16 sm:h-20 gap-3 sm:gap-6">
      
      <!-- 1. Logo (Left side) -->
      <a href="/" class="flex items-center gap-2.5 shrink-0 group py-1" aria-label="PureFlora Home">
        <!-- Minimal Botanical Floral Emblem -->
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-emerald-800 text-white flex items-center justify-center shadow-xs group-hover:bg-emerald-700 transition">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2C9.5 5 7 8 7 11.5C7 14.5 9.2 17 12 17C14.8 17 17 14.5 17 11.5C17 8 14.5 5 12 2Z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 17V22"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 19C9.5 18 10.5 16 10.5 16"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 19C14.5 18 13.5 16 13.5 16"/>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="font-extrabold text-lg sm:text-xl tracking-tight text-zinc-900 leading-none group-hover:text-emerald-800 transition">
            Pure<span class="text-emerald-700">Flora</span>
          </span>
          <span class="text-[10px] text-zinc-400 font-medium tracking-wider uppercase mt-0.5 hidden xs:block">
            Fresh Flora B2B &amp; B2P
          </span>
        </div>
      </a>

      <!-- 2. Search Bar (Desktop Prominent Center) -->
      <div class="hidden md:flex flex-1 max-w-2xl mx-auto relative">
        <div class="relative w-full">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search flowers, bouquets, bulk orders..." 
            class="w-full pl-10 pr-10 py-2.5 bg-zinc-50 hover:bg-zinc-100/70 focus:bg-white text-zinc-900 placeholder-zinc-400 text-sm rounded-xl border border-zinc-200 focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20 transition outline-none"
            autocomplete="off"
          />
          <button 
            type="button" 
            id="search-clear-btn" 
            class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-zinc-400 hover:text-zinc-600"
            aria-label="Clear search"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 3. Actions Group: Mode Switcher, Cart, Login -->
      <div class="flex items-center gap-2 sm:gap-4 shrink-0">

        <!-- Shopping For: Personal / Business Pill Switcher -->
        <div class="hidden lg:flex items-center bg-zinc-100 p-1 rounded-lg border border-zinc-200/70 text-xs">
          <span class="text-zinc-400 font-medium px-2 select-none text-[11px]">Shopping for:</span>
          <button 
            type="button" 
            id="mode-personal-btn"
            class="px-3 py-1 text-xs font-semibold rounded-md bg-white text-zinc-900 shadow-sm border border-zinc-200 transition"
          >
            Personal
          </button>
          <button 
            type="button" 
            id="mode-business-btn"
            class="px-3 py-1 text-xs font-medium rounded-md text-zinc-600 hover:text-zinc-900 transition"
          >
            Business
          </button>
        </div>

        <!-- Cart Button -->
        <button 
          type="button" 
          id="open-cart-btn"
          class="relative p-2 sm:px-3 sm:py-2 rounded-xl border border-zinc-200 hover:border-zinc-300 hover:bg-zinc-50 text-zinc-700 hover:text-zinc-900 flex items-center gap-2 transition"
          aria-label="Shopping Cart"
        >
          <div class="relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <span 
              id="cart-badge" 
              class="hidden absolute -top-2 -right-2.5 bg-emerald-700 text-white text-[10px] font-bold rounded-full h-4 min-w-4 px-1 flex items-center justify-center transition-transform"
            >
              0
            </span>
          </div>
          <span class="hidden sm:inline text-xs font-semibold">Cart</span>
        </button>

        <!-- Login Button (Ready for Django Auth) -->
        {% if user.is_authenticated %}
          <div class="flex items-center gap-2">
            <a href="/accounts/profile/" class="px-3.5 py-2 text-xs font-semibold text-zinc-700 hover:text-zinc-900 rounded-xl border border-zinc-200 bg-white">
              Hi, {{ user.first_name|default:user.username }}
            </a>
          </div>
        {% else %}
          <button 
            type="button" 
            id="open-login-btn"
            class="px-3.5 py-2 sm:px-4 sm:py-2 text-xs sm:text-sm font-semibold rounded-xl bg-zinc-900 text-white hover:bg-zinc-800 transition shadow-xs flex items-center gap-1.5"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span>Login</span>
          </button>
        {% endif %}

      </div>

    </div>

    <!-- Mobile Search Row & Mode Switcher (< md) -->
    <div class="md:hidden pb-3 pt-1 space-y-2">
      <!-- Search Input -->
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <input 
          type="text" 
          id="mobile-search-input" 
          placeholder="Search flowers, bouquets, bulk orders..." 
          class="w-full pl-9 pr-3 py-2 bg-zinc-50 text-zinc-900 placeholder-zinc-400 text-xs rounded-lg border border-zinc-200 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 outline-none"
          oninput="document.getElementById('search-input').value = this.value; document.getElementById('search-input').dispatchEvent(new Event('input'))"
        />
      </div>

      <!-- Mobile Mode Switcher -->
      <div class="flex items-center justify-between bg-zinc-100 p-1 rounded-lg text-xs">
        <span class="text-zinc-500 font-medium px-2 text-[11px]">Shopping for:</span>
        <div class="flex gap-1">
          <button 
            type="button" 
            onclick="window.PureFlora.setShoppingMode('personal')"
            class="px-2.5 py-1 text-xs font-semibold rounded bg-white text-zinc-900 shadow-xs"
          >
            Personal
          </button>
          <button 
            type="button" 
            onclick="window.PureFlora.setShoppingMode('business')"
            class="px-2.5 py-1 text-xs font-medium rounded text-zinc-600"
          >
            Business (B2B)
          </button>
        </div>
      </div>
    </div>

  </div>
</header>
