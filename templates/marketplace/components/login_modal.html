<!-- Login & B2B Partner Onboarding Modal -->
<div 
  id="login-modal" 
  class="fixed inset-0 z-50 pointer-events-none flex items-center justify-center p-4 sm:p-6" 
  aria-modal="true" 
  role="dialog"
>
  <!-- Backdrop -->
  <div 
    id="login-backdrop" 
    class="fixed inset-0 bg-zinc-900/50 backdrop-blur-xs opacity-0 transition-opacity duration-200"
  ></div>

  <!-- Modal Panel -->
  <div class="modal-panel relative w-full max-w-md bg-white rounded-2xl shadow-2xl border border-zinc-200 overflow-hidden transform scale-95 opacity-0 transition-all duration-200 z-10">
    
    <!-- Modal Header -->
    <div class="px-6 pt-6 pb-4 border-b border-zinc-100 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2C9.5 5 7 8 7 11.5C7 14.5 9.2 17 12 17C14.8 17 17 14.5 17 11.5C17 8 14.5 5 12 2Z"/>
          </svg>
        </div>
        <div>
          <h3 class="font-bold text-zinc-900 text-base">Sign in to BloomMart</h3>
          <span class="text-[11px] text-zinc-500">Access retail orders or wholesale portal</span>
        </div>
      </div>
      <button 
        type="button" 
        id="close-login-btn"
        class="p-2 -mr-2 text-zinc-400 hover:text-zinc-600 rounded-lg transition"
        aria-label="Close login dialog"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Tabs: Retail Buyer vs B2B Wholesale -->
    <div class="px-6 pt-4">
      <div class="flex border-b border-zinc-200 text-xs font-semibold">
        <button 
          type="button" 
          id="tab-retail-btn"
          onclick="document.getElementById('form-retail').classList.remove('hidden'); document.getElementById('form-business').classList.add('hidden'); this.className='py-2 px-3 border-b-2 border-emerald-700 text-emerald-800 font-bold'; document.getElementById('tab-b2b-btn').className='py-2 px-3 text-zinc-500 hover:text-zinc-800 font-medium';"
          class="py-2 px-3 border-b-2 border-emerald-700 text-emerald-800 font-bold"
        >
          Customer Login
        </button>
        <button 
          type="button" 
          id="tab-b2b-btn"
          onclick="document.getElementById('form-business').classList.remove('hidden'); document.getElementById('form-retail').classList.add('hidden'); this.className='py-2 px-3 border-b-2 border-emerald-700 text-emerald-800 font-bold'; document.getElementById('tab-retail-btn').className='py-2 px-3 text-zinc-500 hover:text-zinc-800 font-medium';"
          class="py-2 px-3 text-zinc-500 hover:text-zinc-800 font-medium"
        >
          Business Partner (B2B)
        </button>
      </div>
    </div>

    <!-- Form Body -->
    <div class="p-6">
      
      <!-- Customer Login Form -->
      <form id="form-retail" onsubmit="event.preventDefault(); alert('Login successful! Connected to Django Auth in production.'); window.BloomMart.closeLoginModal();" class="space-y-4 text-xs sm:text-sm">
        <div>
          <label class="block font-medium text-zinc-700 mb-1" for="user-phone">Mobile Number or Email</label>
          <input 
            type="text" 
            id="user-phone" 
            placeholder="+91 98765 43210" 
            required
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 outline-none"
          />
        </div>
        <div>
          <label class="block font-medium text-zinc-700 mb-1" for="user-password">Password / OTP</label>
          <input 
            type="password" 
            id="user-password" 
            placeholder="Enter password or OTP" 
            required
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 outline-none"
          />
        </div>
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-1.5 text-zinc-600 cursor-pointer">
            <input type="checkbox" class="w-3.5 h-3.5 rounded text-emerald-600 border-zinc-300">
            <span>Remember me</span>
          </label>
          <a href="#" class="text-emerald-700 hover:underline">Forgot password?</a>
        </div>
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 rounded-xl font-semibold bg-emerald-700 hover:bg-emerald-800 text-white shadow-xs transition"
        >
          Sign In
        </button>
      </form>

      <!-- Business Wholesale Form -->
      <form id="form-business" onsubmit="event.preventDefault(); alert('B2B Wholesale account verified! Bulk rates and credit terms enabled.'); window.BloomMart.setShoppingMode('business'); window.BloomMart.closeLoginModal();" class="hidden space-y-4 text-xs sm:text-sm">
        <div>
          <label class="block font-medium text-zinc-700 mb-1" for="b2b-company">Business / Florist Name</label>
          <input 
            type="text" 
            id="b2b-company" 
            placeholder="e.g. Royal Blooms & Decorators" 
            required
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 outline-none"
          />
        </div>
        <div>
          <label class="block font-medium text-zinc-700 mb-1" for="b2b-gst">GSTIN Number (for tax exemption &amp; invoices)</label>
          <input 
            type="text" 
            id="b2b-gst" 
            placeholder="22AAAAA0000A1Z5" 
            required
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 outline-none uppercase font-mono"
          />
        </div>
        <div>
          <label class="block font-medium text-zinc-700 mb-1" for="b2b-phone">Business Contact</label>
          <input 
            type="tel" 
            id="b2b-phone" 
            placeholder="+91 98765 43210" 
            required
            class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 outline-none"
          />
        </div>
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 rounded-xl font-semibold bg-zinc-900 hover:bg-zinc-800 text-white shadow-xs transition"
        >
          Access Wholesale Portal
        </button>
      </form>

    </div>

    <!-- Modal Footer -->
    <div class="px-6 py-3 bg-zinc-50 border-t border-zinc-100 text-center text-xs text-zinc-500">
      Need assistance? Contact florist helpline <span class="font-semibold text-zinc-700">+91 1800-BLOOM</span>
    </div>

  </div>
</div>
